<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e20"/>
      <stop offset="100%" stop-color="#0e1e4a"/>
    </linearGradient>
    <linearGradient id="symbol" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c0c1ff"/>
      <stop offset="100%" stop-color="#21bedc"/>
    </linearGradient>
  </defs>
  <!-- Background: dark rounded square -->
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <!-- Nabla ∇: gradient stroke from primary-dim (top) to secondary (apex) -->
  <path d="M13 16 L51 16 L32 50 Z"
        fill="none"
        stroke="url(#symbol)"
        stroke-width="4"
        stroke-linejoin="round"
        stroke-linecap="round"/>
</svg>
