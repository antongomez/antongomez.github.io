version = 1
SPDX-PackageName = "portfolio"
SPDX-PackageSupplier = "Antón Gómez López"
SPDX-PackageDownloadLocation = "https://github.com/antongomez/portfolio"

# ---------------------------------------------------------------------------
# Code and configuration that cannot carry an SPDX header (JSON, plain text,
# lockfiles). Every other source file has its own header. -> MIT
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "package.json",
  "package-lock.json",
  "src/locales/*.json",
  "public/robots.txt",
  "public/sitemap.xml",
  "README.md",
]
SPDX-FileCopyrightText = "2026 Antón Gómez López"
SPDX-License-Identifier = "MIT"

# ---------------------------------------------------------------------------
# Own images: photos, screenshots of my projects, diagrams, favicon
# -> CC BY 4.0
# ---------------------------------------------------------------------------
[[annotations]]
path = [
  "public/**/*.webp",
  "public/**/*.jpg",
  "public/**/*.png",
  "public/favicon.svg",
]
SPDX-FileCopyrightText = "2026 Antón Gómez López"
SPDX-License-Identifier = "CC-BY-4.0"

# ---------------------------------------------------------------------------
# Academic theses and CV -> CC BY-NC-ND 4.0
# (may be shared verbatim with attribution; no derivatives, no commercial use)
# ---------------------------------------------------------------------------
[[annotations]]
